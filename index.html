      <div class="ears">
        <div class="ear"><b>Records Edition</b>Published without interruption since the archive began</div>
        <h1><a href="#home">The Solis Archive</a></h1>
        <div class="ear"><b>Price: Your Silence</b>Banned in Oceania · Disputed in Eurasia</div>
      </div>
      <p class="motto">“All the records that survived the fire, and several that should not have.”</p>
      <div class="dateline"><span>Vol. XII · No. ${R.length}</span><span>Printed under perpetual snow</span><span>Daylight today: three hours</span></div>
    </header>

    <div class="front">
      <article>
        <div class="kicker">History · ${lead.acc}</div>
        <h2 class="hl xl"><a href="#cataclysm">${HEADLINES.cataclysm[0]}</a></h2>
        <p class="deck">${HEADLINES.cataclysm[1]}</p>
        <div class="byline">From the Solis Archive · Historical desk</div>
        ${photo("world", "ar-wide", "The world after: snow, ruin, and a sun that barely rises.", CREDIT.world)}
        <div class="cols">${paras(excerpt(lead, 260), 75)}<p class="more"><a href="#cataclysm">Continued in record ${lead.acc} →</a></p></div>
      </article>
      <aside class="side">
        <div class="box"><h3>Briefs</h3><ul>${DYK.map(d => `<li>${md(d)}</li>`).join("")}</ul></div>
        <div class="box truths"><h3>Two Truths</h3>
          <blockquote><p>“By grace of Providence, the realm endures.”</p><cite>The Crown &amp; Altar Gazette, Eurasia</cite></blockquote>
          <blockquote><p>“There was no other way.”</p><cite>Founding doctrine, Oceania</cite></blockquote>
        </div>
        <div class="box notice"><b>Sealed by Order</b>The records of the <span class="redact" tabindex="0" role="button" aria-label="Redacted">First</span>, <span class="redact" tabindex="0" role="button" aria-label="Redacted">Second</span> and <span class="redact" tabindex="0" role="button" aria-label="Redacted">Seventh</span> Generals are not available to readers of this edition.</div>
      </aside>
    </div>

    <hr class="rule double">
    <div class="band three">
      ${story("eurasia", "", "ar-photo", 90)}
      ${story("oceania", "", "ar-photo", 90)}
      ${story("novagrad", "", "ar-photo", 90)}
    </div>

    <hr class="rule double">
    <div class="band four">
      ${["founding-myth","council","adc","places-oceania"].map(id => story(id, "sm", "ar-sq", 50)).join("")}
    </div>

    <hr class="rule thick">
    <div class="band two">
      <section class="letters">
        <div class="kicker">Correspondence</div>
        <h2 class="hl">Letters to the Archivist</h2>
        <h4>Who started the Cataclysm?</h4><div class="from">A reader in Ashgate</div><p>Every surviving nation has an answer. None of them match. See ${md("[[cataclysm|The Cataclysm]]")}.</p>
        <h4>Is the Third General human?</h4><div class="from">Name withheld</div><p>The archive declines to speculate. Its correspondents mostly do not. See ${md("[[noctis|Noctis]]")}.</p>
        <h4>Why does Oceania keep attacking one small city?</h4><div class="from">A worker in the Furnace District</div><p>Because the city is a question Oceania cannot afford to have answered. See ${md("[[novagrad|Novagrad]]")}.</p>
        <h4>What is the Eurasian capital called?</h4><div class="from">A reader in the Capital</div><p>The archive would also like to know.</p>
        <h4>Why are some passages blacked out?</h4><div class="from">Several readers</div><p>Restricted material. Click a redaction to declassify it. The archive accepts no responsibility for what you then know.</p>
      </section>
      <section>
        <div class="box"><h3>In This Edition</h3><ul>${CATS.map(c => { const list = R.filter(r => r.cat === c); return `<li><b>${c}</b> — ${list.map(r => `<a href="#${r.id}">${r.title}</a>`).join(", ")}</li>`; }).join("")}</ul></div>
        <div class="box notice"><b>Notice to Readers in Oceania</b>Possession of this edition is a matter for Harrow Station. The archive recommends reading it quickly.</div>
      </section>
    </div>
    ${imprint()}
  </div>`;
  renderArt(view);
}

let overreachShown = false;
function checkOverreach(){
  if (overreachShown || !view.querySelector(".rec-top")) return;
  if (view.querySelector("[data-declassify], .redact:not(.open)")) return;
  overreachShown = true;
  const id = location.hash.slice(1) || "records";
  const no = "HS-" + ((hash(id) % 9000) + 1000);
  const top = view.querySelector(".rec-top");
  const old = top.querySelector(".stamp-mark"); if (old) old.remove();
  top.insertAdjacentHTML("beforeend", `<span class="stamp-mark" aria-hidden="true">Report filed</span>`);
  const am = view.querySelector(".amended"); if (am) am.insertAdjacentHTML("beforeend", ` · <span style="color:var(--red)">Reader's access logged, file ${no}</span>`);
  const d = document.createElement("div"); d.className = "overreach"; d.setAttribute("role", "alert");
  d.innerHTML = `<div class="stamp-big"><b>You have read too much.</b>A report has been filed with Harrow Station.<small>File ${no} · Reader's access logged</small></div>`;
  document.body.appendChild(d);
  d.addEventListener("click", () => d.remove());
  setTimeout(() => d.classList.add("fade"), 4200); setTimeout(() => d.remove(), 5300);
}
function renderRecord(r){
  overreachShown = false;
  const cls = r.status.toLowerCase();
  const key = artFor(r.id);
  const sameArt = r.info && r.info.art === key;
  const leadCap = sameArt ? ((ART[r.info.art] && r.info.pcap) ? r.info.pcap : r.info.caption) : (BANNER_CAP[key] || (r.info && r.info.caption) || "");
  let info = "";
  if (r.info) {
    const portrait = r.info.art.startsWith("insignia");
    const cap = (ART[r.info.art] && r.info.pcap) ? r.info.pcap : r.info.caption;
    info = `<aside class="infobox" aria-label="Fact box"><div class="ititle">${r.title}</div>${sameArt ? "" : `<figure>${artHTML(r.info.art, r.info.caption, ART[r.info.art] ? "natural" : (portrait ? "portrait" : ""))}<figcaption>${md(cap)}</figcaption></figure>`}<table>${r.info.rows.map(([k,v]) => `<tr><th scope="row">${k}</th><td>${md(v)}</td></tr>`).join("")}</table></aside>`;
  }
  const contents = `<div class="box contents"><h3>In this record</h3><ol>${r.sections.map((s,i) => `<li><button type="button" data-goto="sec-${i}">${s.h}</button></li>`).join("")}${r.notes && r.notes.length ? `<li><button type="button" data-goto="notes">Notes</button></li>` : ""}</ol></div>`;
  const related = r.see && r.see.length ? `<div class="box related"><h3>Related records</h3>${r.see.filter(id => BY_ID[id]).map(id => `<a href="#${id}">${artHTML(thumbFor(id), BY_ID[id].title)}<b>${BY_ID[id].title}</b></a>`).join("")}</div>` : "";
  const sections = r.sections.map((s,i) => {
    if (s.restricted) return `<h2 id="sec-${i}">${s.h}</h2><div class="restricted"><div class="gate"><span>■ RESTRICTED · CLEARANCE REQUIRED</span><button type="button" data-declassify="${i}">Declassify</button></div><div class="body" id="rb-${i}" hidden>${md(s.html)}</div></div>`;
    return `<h2 id="sec-${i}">${s.h}</h2>${md(s.html)}`;
  }).join("");
  const notes = r.notes && r.notes.length ? `<section class="notes" id="notes"><h2>Sources &amp; Notes</h2><ol>${r.notes.map((n,i) => `<li id="note-${i+1}"><button class="back" type="button" data-back="${i+1}" aria-label="Back to reference ${i+1}">↑</button>${md(n)}</li>`).join("")}</ol></section>` : "";
  const banner = r.banner ? `<div class="banner ${r.banner[0]}"><b>${r.banner[1]}</b><span>${r.banner[2]}</span></div>` : "";
  const stub = r.status === "Stub" ? `<div class="banner"><b>Incomplete</b><span>This record is a stub. The archive is accepting testimony.</span></div>` : "";
  const lead = r.lead.replace(/^<p>/, '<p class="lead">');
  view.innerHTML = `<div class="sheet">
    ${mastheadSmall(r.cat + " section")}
    <div class="rec-top">
      <div class="kicker">${r.cat} · Accession ${r.acc} · <span class="${cls === "restricted" ? "r" : ""}">Classification: ${r.status}</span></div>
      <h1 class="hl xl">${r.title}</h1>
      ${r.hat ? `<p class="hatnote">${md(r.hat)}</p>` : ""}
      <div class="byline">From the Solis Archive · Revision ${(hash(r.id) % 40) + 3} · Filed under ${r.cat}</div>
      ${r.status === "Restricted" ? `<span class="stamp-mark" aria-hidden="true">Restricted</span>` : ""}
    </div>
    ${banner}${stub}
    <div class="rec-grid">
      <div class="rec-main">
        ${photo(key, ART[key] ? "natural" : "ar-photo", leadCap, CREDIT[key] || "Archive print")}
        <div class="text cols two">${md(lead)}${sections}</div>
        ${notes}
      </div>
      <aside class="rec-side">${info}${contents}${related}</aside>
    </div>
    <div class="amended">Record ${r.acc} · last amended by the archivist</div>
    ${imprint()}
  </div>`;
  renderArt(view);
  view.dataset.notes = JSON.stringify(r.notes || []);
}

function renderIndex(){
  overreachShown = false;
  view.innerHTML = `<div class="sheet">
    ${mastheadSmall("Classified section")}
    <div class="rec-top">
      <div class="kicker">Accession register · ${R.length} open · 3 sealed</div>
      <h1 class="hl xl">Classified Listings</h1>
      <p class="hatnote">Every record held by the archive, by department. Sealed records are listed for completeness and are not available.</p>
    </div>
    <div class="classifieds">
      ${CATS.map(c => { const list = R.filter(r => r.cat === c).sort((a,b) => a.title.localeCompare(b.title)); return list.length ? `<h2>${c}</h2>${list.map(r => `<a class="listing" href="#${r.id}"><b>${r.title}</b><small>${r.acc}${r.status !== "Open" ? " · " + r.status : ""}</small><span>${excerpt(r, 20)}</span></a>`).join("")}` : ""; }).join("")}
      <h2>Sealed</h2>
      ${["First","Second","Seventh"].map((s,i) => `<div class="listing"><b><span class="redact" tabindex="0" role="button" aria-label="Redacted">${s} General</span></b><small style="color:var(--red)">PE-00${[1,2,7][i]} · Sealed</small><span>Record withheld by order.</span></div>`).join("")}
    </div>
    ${imprint()}
  </div>`;
  renderArt(view);
}

/* ===================== CHROME ===================== */
function setupReveal(){}
function watchToc(){}
function onScroll(){}
const topbar = document.getElementById("topbar");
const menuBtn = document.querySelector(".menu-btn");
function setMenu(open){ topbar.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", String(open)); menuBtn.textContent = open ? "Close" : "Sections"; }
menuBtn.addEventListener("click", () => setMenu(!topbar.classList.contains("open")));
document.getElementById("topnav").addEventListener("click", e => { if (e.target.closest("a, button")) setMenu(false); });
window.addEventListener("hashchange", () => setMenu(false));

/* ===================== ROUTER ===================== */
function route(){
  const id = location.hash.slice(1) || "home";
  hideTip();
  if (id !== "home") cancelAnimationFrame(snowRAF);
  if (id === "home") renderHome();
  else if (id === "records") renderIndex();
  else if (BY_ID[id]) renderRecord(BY_ID[id]);
  else { location.replace("#home"); return; }
  document.title = (id === "home" ? "" : ((BY_ID[id] || {title:"All records"}).title + " · ")) + "The Solis Archive";
  window.scrollTo(0, 0);
  onScroll();
  setupReveal();
}
window.addEventListener("hashchange", route);

/* ===================== INTERACTIONS ===================== */
function randomRecord(){ const cur = location.hash.slice(1); let r; do { r = R[Math.floor(Math.random()*R.length)]; } while (R.length > 1 && r.id === cur); location.hash = r.id; }
const tip = document.getElementById("tip");
function hideTip(){ tip.hidden = true; }
function showTip(btn){
  const n = Number(btn.dataset.fn); const notes = JSON.parse(view.dataset.notes || "[]"); if (!notes[n-1]) return;
  tip.innerHTML = `<b>[${n}]</b> ` + md(notes[n-1]); tip.hidden = false;
  const r = btn.getBoundingClientRect(); const w = Math.min(340, window.innerWidth - 24);
  tip.style.width = w + "px";
  tip.style.left = Math.max(12, Math.min(window.scrollX + r.left - 20, window.scrollX + window.innerWidth - w - 12)) + "px";
  tip.style.top = (window.scrollY + r.bottom + 10) + "px";
}
function flash(el){ el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); }
const lastRef = {};
document.addEventListener("click", e => {
  const t = e.target.closest("button, .redact, a"); if (!t) return;
  if (t.matches("[data-random]")) { randomRecord(); return; }
  if (t.matches("[data-fn]")) { const n = t.dataset.fn; lastRef[n] = t; const li = document.getElementById("note-" + n); if (li) { li.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" }); flash(li); } hideTip(); return; }
  if (t.matches("[data-back]")) { const ref = lastRef[t.dataset.back] || document.querySelector(`[data-fn="${t.dataset.back}"]`); if (ref) { ref.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" }); ref.focus({ preventScroll: true }); } return; }
  if (t.matches("[data-goto]")) { const el = document.getElementById(t.dataset.goto); if (el) el.scrollIntoView({ behavior: reduce ? "auto" : "smooth" }); return; }
  if (t.matches("[data-declassify]")) { const b = document.getElementById("rb-" + t.dataset.declassify); b.hidden = false; t.parentElement.querySelector("span").textContent = "□ DECLASSIFIED · READ AT YOUR OWN RISK"; t.remove(); renderArt(b); checkOverreach(); return; }
  if (t.matches(".redact")) { t.classList.add("open"); t.removeAttribute("role"); t.removeAttribute("tabindex"); t.removeAttribute("title"); t.setAttribute("aria-label", "Declassified"); checkOverreach(); return; }
});
document.addEventListener("keydown", e => { const t = e.target; if ((e.key === "Enter" || e.key === " ") && t.classList && t.classList.contains("redact")) { e.preventDefault(); t.click(); } if (e.key === "Escape") { hideTip(); closeResults(); } });
document.addEventListener("mouseover", e => { const b = e.target.closest("[data-fn]"); if (b) showTip(b); });
document.addEventListener("mouseout", e => { if (e.target.closest("[data-fn]")) hideTip(); });
document.addEventListener("focusin", e => { const b = e.target.closest("[data-fn]"); if (b) showTip(b); else hideTip(); });

/* search */
const q = document.getElementById("q"), results = document.getElementById("results");
const INDEX = R.map(r => ({ id: r.id, title: r.title, cat: r.cat, text: (r.title + " " + plain(r.lead) + " " + r.sections.map(s => s.h + " " + (s.restricted ? "" : plain(s.html))).join(" ")).toLowerCase() }));
let active = -1;
function closeResults(){ results.classList.remove("open"); active = -1; }
q.addEventListener("input", () => {
  const term = q.value.trim().toLowerCase(); active = -1;
  if (!term) { closeResults(); return; }
  const hits = INDEX.map(x => ({ x, score: (x.title.toLowerCase().includes(term) ? 10 : 0) + (x.text.split(term).length - 1) })).filter(h => h.score > 0).sort((a,b) => b.score - a.score).slice(0, 8);
  results.innerHTML = hits.length ? hits.map(h => `<li><a href="#${h.x.id}" role="option">${h.x.title}<small>${h.x.cat}</small></a></li>`).join("") : `<li><a href="#records">No record found. Browse all records<small>The archive is incomplete</small></a></li>`;
  results.classList.add("open");
});
q.addEventListener("keydown", e => {
  const items = [...results.querySelectorAll("a")]; if (!items.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); active = (active + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items.forEach((a,i) => a.classList.toggle("active", i === active)); }
  if (e.key === "Enter") { e.preventDefault(); items[active >= 0 ? active : 0].click(); q.value = ""; closeResults(); q.blur(); }
});
results.addEventListener("click", () => { q.value = ""; closeResults(); });
document.addEventListener("click", e => { if (!e.target.closest(".search")) closeResults(); });

let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => renderArt(view), 200); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderArt(view));
route();
</script>
